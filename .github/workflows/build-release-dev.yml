name: Build and release dev
on:
  push:
    branches:
      - "dev"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.EXTERNAL_PRIVATE_REGISTRY }}
          username: ${{ secrets.EXTERNAL_PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.EXTERNAL_PRIVATE_REGISTRY_PASSWORD }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: docker/Dockerfile
          tags: ${{ secrets.EXTERNAL_PRIVATE_REGISTRY }}/telescopio/web:dev
          cache-from: ${{ secrets.EXTERNAL_PRIVATE_REGISTRY }}/telescopio/web:dev
